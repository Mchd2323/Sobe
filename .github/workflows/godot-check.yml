name: Godot check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot headless indir
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL -o "$HOME/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Parse kontrolu (editor import)
        run: |
          "$GODOT" --headless --editor --quit --path . 2>&1 | tee import.log || true
          if grep -qE "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::GDScript parse hatasi"
            grep -E "SCRIPT ERROR|Parse Error|  at: " import.log
            exit 1
          fi
          echo "Parse temiz."

      - name: Smoke test (oyunu 10 sn calistir)
        run: |
          timeout 10 "$GODOT" --headless --path . 2>&1 | tee run.log || true
          if grep -qE "SCRIPT ERROR|ERROR:" run.log; then
            echo "::error::Calisma-zamani hatasi"
            grep -E "SCRIPT ERROR|ERROR:" run.log
            exit 1
          fi
          echo "Runtime temiz."

      - name: Brifing modulu testi (rol bazli kart)
        run: |
          set +e
          timeout 60 "$GODOT" --headless --path . -- --sobe-briefingtest 2>&1 | tee brief.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            echo "::error::Brifing modulu testi basarisiz"
            exit 1
          fi
          grep "BRIFING" brief.log

      - name: Duel-AI cekirdegi testi (deterministik duello)
        run: |
          set +e
          timeout 90 "$GODOT" --headless --path . -- --sobe-dueltest 2>&1 | tee duel.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            echo "::error::Duel-AI testi basarisiz"
            exit 1
          fi
          grep -E "DETERMINIZM|CESITLILIK|NOT" duel.log

      - name: Bot maci testi (3 mac)
        run: |
          for i in 1 2 3; do
            set +e
            timeout 200 "$GODOT" --headless --path . -- --sobe-autotest 2>&1 | tee -a bot.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" != "0" ]; then
              echo "::error::Bot maci $i basarisiz (cikis kodu $code) - tur bitmiyor olabilir"
              exit 1
            fi
          done
          echo "--- sonuclar ---"
          grep "SONUC:" bot.log
